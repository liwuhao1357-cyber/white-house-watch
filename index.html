<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White House / Watch</title><style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#111721;--line:#28313f;--text:#e6eaf1;--muted:#8997a9;--gold:#e8b66c;--blue:#8ab4e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1260px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:36px 40px 24px;border-bottom:1px solid var(--line)}h1{font-size:24px;letter-spacing:2px;margin:0;font-weight:800}h1 span{color:var(--gold)}.sub{font-size:12px;letter-spacing:3px;color:var(--muted);margin-top:6px}.clock{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.nav{display:flex;gap:28px;padding:0 40px;border-bottom:1px solid var(--line);overflow:auto}button,input{font:inherit}button{cursor:pointer;color:var(--muted);background:none;border:0}button:hover{color:var(--text)}.nav button{white-space:nowrap;padding:16px 0;border-bottom:2px solid transparent}.nav button.active{color:var(--gold);border-color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;min-height:65vh}.feed{padding:28px 40px}.aside{background:var(--panel);padding:30px 24px;border-left:1px solid var(--line)}.section{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin:0 0 12px}.search{display:flex;gap:10px;margin-bottom:24px}input{min-width:0;border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:#0b1017;color:var(--text)}#q{flex:1}.day{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px;margin:18px 0 0}.day:after{content:"";height:1px;background:var(--line);flex:1}.story{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}.time{font:12px/1.6 monospace;color:var(--muted);padding-top:3px}.tag{font-size:10px;letter-spacing:1px;color:var(--gold);font-weight:700}.tag.wh{color:var(--blue)}.headline{font-size:17px;line-height:1.6;margin:7px 0;overflow-wrap:anywhere;white-space:pre-wrap}.desc{color:#a0adbd;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-size:12px}.actions{display:flex;gap:16px;align-items:center;margin-top:10px;font-size:12px}.actions button{padding:0}.actions a{color:var(--muted);text-decoration:none}.source{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;display:grid;place-items:center;border:1px solid #354155;background:#202a3b;border-radius:7px;color:#b9c9dc;font-weight:700;font-size:12px}.source small{display:block;color:var(--muted);overflow-wrap:anywhere;font-size:11px}.status{font-size:11px;margin-top:10px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}.topics{display:flex;flex-wrap:wrap;gap:7px}.topics button{border:1px solid #303b4c;border-radius:4px;padding:5px 9px;font-size:12px}.empty{margin:48px 0;text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:6px}footer{border-top:1px solid var(--line);padding:15px 40px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:15px}.notice{font-size:11px;color:var(--muted);margin:8px 0}.refresh{border:1px solid var(--line);border-radius:4px;padding:5px 9px;margin-top:4px} @media(max-width:680px){header{padding:24px 18px 18px}h1{font-size:17px;letter-spacing:1px}.nav{padding:0 18px;gap:20px}.layout{grid-template-columns:1fr}.feed{padding:20px 18px}.aside{border-left:0;border-top:1px solid var(--line);padding:20px 18px}.story{grid-template-columns:42px 1fr;gap:10px}.headline{font-size:16px}footer{padding:14px 18px}.search{flex-wrap:wrap}#q{min-width:160px}}
</style></head><body><main><header><div><h1>WHITE HOUSE<span> / WATCH</span></h1><div class="sub">美国政策情报监控</div></div><div class="clock"><div id="clock">北京时间</div><button class="refresh" id="refresh">↻ 刷新</button></div></header><nav class="nav"><button class="active" data-kind="all">实时动态</button><button data-kind="trump">特朗普</button><button data-kind="whitehouse">白宫</button><button data-kind="history">历史档案</button></nav><div class="layout"><section class="feed"><div class="search"><input id="q" placeholder="搜索中英文消息与关键词" aria-label="搜索"><input id="day" type="date" aria-label="北京时间日期"></div><div class="notice" id="notice">正在连接数据服务…</div><div id="list"><div class="empty">等待真实数据</div></div></section><aside class="aside"><div class="section">MONITOR / 数据源</div><div id="sources"></div><div class="section" style="margin-top:28px">TOPICS / 快速筛选</div><div class="topics" id="topics"></div><div class="section" style="margin-top:28px">SYSTEM / 更新状态</div><div class="status" id="sys">计划每5分钟采集；实际延迟取决于信源和任务调度。</div></aside></div><footer><span>WHITE HOUSE WATCH</span><span>独立观察项目 · 非白宫官方网站 · 北京时间</span></footer></main><script>
const $=id=>document.getElementById(id), el=(tag,cls,text)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};let kind='all',seq=0,queryTimer;const fmt=(s,opt)=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',...opt}).format(new Date(s));const hm=s=>fmt(s,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}), full=s=>fmt(s,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const day=s=>fmt(s,{year:'numeric',month:'long',day:'numeric'});const names={trump:'TRUMP’S TRUTH RSS / 特朗普',whitehouse:'THE WHITE HOUSE / 白宫',order:'PRESIDENTIAL ACTIONS / 行政文件'};
function statusRows(status){let root=$('sources');root.replaceChildren();for(let [s,n,a] of [['trump','Trump’s Truth RSS','T'],['whitehouse','白宫官方公告','WH'],['actions','总统行政文件','PA']]){let r=status[s],wrap=el('div','source'),body=el('div');wrap.append(el('div','logo',a),body);body.append(el('b','',n),el('small','',r?.error?'● 采集失败':r?.success?'● 采集正常':'● 等待采集'));if(r?.success)body.append(el('small','','最近成功 '+full(r.success)));if(r?.error)body.append(el('small','',r.error));root.append(wrap)}}
function render(items){let root=$('list');root.replaceChildren();if(!items.length){root.append(el('div','empty','暂无符合条件的真实消息。首次启动或信源异常时不会填充虚构数据。'));return}let last='';for(let x of items){let d=day(x.published);if(d!==last){root.append(el('div','day',d));last=d}let card=el('article','story'),content=el('div');card.append(el('div','time',hm(x.published)),content);content.append(el('div','tag '+(x.source==='whitehouse'?'wh':''),'● '+names[x.kind]));let original=x.title||x.content;content.append(el('div','headline',x.zh||original));if(x.zh)content.append(el('div','notice','机器译文（标题或发文前段）'));let details=el('details'), summary=el('summary','','展开英文摘录');details.append(summary,el('div','desc',[x.title,x.content].filter(Boolean).join('\n\n')));content.append(details);let act=el('div','actions'),a=el('a','','来源链接 ↗');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';let copy=el('button','','复制');copy.onclick=async()=>{try{await navigator.clipboard.writeText((x.zh||original)+'\n'+x.url);copy.textContent='已复制'}catch{copy.textContent='复制失败，请手动选取'}};act.append(a,copy);content.append(act);root.append(card)}}
async function load(){let n=++seq;try{let url='/api/feed';let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!Array.isArray(j.items))throw Error('Invalid feed');if(n!==seq)return;statusRows(j.status||{});let q=$('q').value.toLowerCase().trim(), selected=$('day').value;let rows=j.items.filter(x=>(kind==='all'||kind==='history'||x.source===kind)&&(!q||[x.title,x.content,x.zh].join(' ').toLowerCase().includes(q))&&(!selected||new Date(new Date(x.published).getTime()+28800000).toISOString().slice(0,10)===selected));render(rows.slice(0,300));$('sys').textContent='最近任务：'+(j.updated?full(j.updated):'尚未采集')+' · 计划每5分钟检查';$('notice').textContent=(j.updated && Date.now()-new Date(j.updated).getTime()>1800000?'⚠ 数据已超过30分钟未更新 · ':'')+`${rows.length} 条匹配消息（最多显示300条） · ${j.translate?'机器翻译已配置，译文按可用情况显示':'翻译未配置，显示英文原文'} · 页面每60秒刷新`; }catch(e){if(n===seq)$('notice').textContent='数据服务未连接，保留上一次显示内容。'}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));if(kind!=='history')$('day').value='';load()});$('q').oninput=()=>{clearTimeout(queryTimer);queryTimer=setTimeout(load,250)};$('day').onchange=load;$('refresh').onclick=load;for(let [t,k] of [['中国','China'],['关税','tariff'],['贸易','trade'],['美联储','Federal Reserve'],['科技','technology'],['外交','diplomacy'],['能源','energy']]){let b=el('button','',t);b.onclick=()=>{$('q').value=k;load()};$('topics').append(b)}function tick(){$('clock').textContent='北京时间 '+fmt(Date.now(),{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'})}tick();setInterval(tick,1000);load();setInterval(load,60000);
</script></body></html>
