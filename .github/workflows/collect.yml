name: Collect White House Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '7-57/10 * * * *'
permissions:
  contents: write
concurrency:
  group: white-house-watch-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify collector
        run: python3 -m unittest -v test_collector
      - name: Collect real source feeds
        env:
          WATCH_TRANSLATE: '1'
        run: python3 collector.py
      - name: Save data without rebuilding the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh source feed"
          git push
